version: "1.1"
scope: "umbrella"
repository: "WeRa Global"
description: "Umbrella-level registry of reusable development skills for WeRa Global and ProductionBase repositories."
owners:
  - "WeRa Global maintainers"
sources:
  - name: "andrej-karpathy-skills"
    url: "https://github.com/forrestchang/andrej-karpathy-skills"
    adopted_elements:
      - "Think Before Coding"
      - "Simplicity First"
      - "Surgical Changes"
      - "Goal-Driven Execution"
default_inheritance:
  applies_to:
    - "ProductionBase/*"
  override_policy: "Project-specific skills may extend or override behavior but must preserve quality and security guardrails from umbrella WARP.md."
execution_profiles:
  default_development_flow:
    - "repo-orientation"
    - "task-intake"
    - "karpathy-guidelines"
    - "implementation-plan"
    - "quality-gate"
    - "release-readiness"
    - "retro-capture"
  pr_review_audit_flow:
    - "repo-orientation"
    - "revisor-pr-audit"
    - "quality-gate"
    - "release-readiness"
  fast_path_small_change:
    - "task-intake"
    - "karpathy-guidelines"
    - "quality-gate"
  python_async_service_flow:
    - "repo-orientation"
    - "task-intake"
    - "karpathy-guidelines"
    - "python-systempy-lifecycle"
    - "implementation-plan"
    - "quality-gate"
    - "release-readiness"
    - "retro-capture"
skills:
  - id: "repo-orientation"
    name: "Repository Orientation"
    path: "skills/repo-orientation.md"
    intent: "Map structure, constraints, and executable workflows before implementation."
  - id: "task-intake"
    name: "Task Intake and Scoping"
    path: "skills/task-intake.md"
    intent: "Convert incoming requests into bounded, testable deliverables."
  - id: "karpathy-guidelines"
    name: "Karpathy Development Guidelines"
    path: "skills/karpathy-guidelines.md"
    intent: "Reduce coding mistakes by surfacing assumptions, keeping changes simple/surgical, and defining verifiable goals."
  - id: "implementation-plan"
    name: "Implementation Planning"
    path: "skills/implementation-plan.md"
    intent: "Produce safe execution plans for medium and high-complexity changes."
  - id: "quality-gate"
    name: "Quality Gate Execution"
    path: "skills/quality-gate.md"
    intent: "Run and report project-native validation checks before completion."
  - id: "release-readiness"
    name: "Release Readiness Review"
    path: "skills/release-readiness.md"
    intent: "Verify documentation, operational impact, and rollback posture before release."
  - id: "retro-capture"
    name: "Retrospective Capture"
    path: "skills/retro-capture.md"
    intent: "Record outcomes, incidents, and follow-up improvements for future iterations."
  - id: "python-systempy-lifecycle"
    name: "Python systemPY Lifecycle Integration"
    path: "skills/python-systempy-lifecycle.md"
    intent: "Standardize startup, shutdown, and reload behavior for Python asyncio applications using systemPY lifecycle units."
  - id: "revisor-pr-audit"
    name: "Revisor PR Audit"
    path: "skills/revisor-pr-audit.md"
    intent: "Run structured, evidence-based pull-request review with explicit severity, mentoring-quality feedback, and actionable remediation guidance."
