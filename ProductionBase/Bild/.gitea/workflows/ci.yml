name: bild-ci
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  baseline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Baseline documentation check
        run: |
          test -f README.md
          test -f WARP.md
          test -f CONTRIBUTING.md
          test -d docs/adr
          test -d tasks
          test -d skills
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src session_test.py har_extract.py
      - name: Tests
        run: pytest -q
