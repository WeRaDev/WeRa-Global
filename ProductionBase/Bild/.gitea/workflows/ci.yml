name: bild-ci
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  baseline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Baseline documentation check
        run: |
          test -f README.md
          test -f WARP.md
          test -f CONTRIBUTING.md
          test -d docs/adr
          test -d tasks
          test -d skills
