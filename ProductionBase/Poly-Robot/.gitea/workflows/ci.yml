name: poly-robot-ci
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
jobs:
  baseline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install static tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install mypy ruff bandit
      - name: Baseline repository structure check
        run: |
          test -f README.md
          test -f WARP.md
          test -f CONTRIBUTING.md
          test -d tasks
          test -d skills
      - name: Lint check
        run: |
          ruff check src/poly_robot tests scripts
      - name: Parameter governance validation
        run: |
          python3 scripts/validate_parameters.py \
            --catalog config/parameters/catalog.v1.json \
            --profile config/parameters/profiles/mvp_test_token.v1.json \
            --baseline config/parameters/baselines/mvp_test_token.freeze.v1.json \
            --calibration-policy config/calibration/llm_reliability.v1.json
      - name: Governance unit tests
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -p "test_*.py"
      - name: Security regression checks
        run: |
          PYTHONPATH=src python3 -m unittest \
            tests.test_integration_adapters \
            tests.test_llm_policy \
            tests.test_parameter_governance
      - name: Security static analysis
        run: |
          bandit -q -r src/poly_robot scripts -s B404,B603,B310,B105
      - name: UX regression checks
        run: |
          PYTHONPATH=src python3 -m unittest \
            tests.test_runtime_web_gui \
            tests.test_runtime_supervisor_controls \
            tests.test_runtime_supervisor_live
      - name: Rollout rehearsal protocol gate
        run: |
          python3 scripts/run_rollout_rehearsal.py \
            --protocol-config config/integration/live_rollout_rehearsal.v1.json \
            --work-dir runtime/rollout_rehearsal \
            --output-path runtime/rollout_rehearsal_report.json
      - name: Enforce rollout rehearsal report policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("runtime/rollout_rehearsal_report.json")
          if not report_path.exists():
              raise SystemExit("Missing rollout rehearsal report artifact")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = report.get("summary", {})
          overall_status = str(summary.get("overall_status", "UNKNOWN"))
          if overall_status != "SUCCESS":
              raise SystemExit(
                  "Rollout rehearsal failed: "
                  f"summary.overall_status={overall_status}"
              )
          rollback_recommendations = report.get("rollback_recommendations", [])
          if rollback_recommendations:
              raise SystemExit(
                  "Rollout rehearsal reported blocking rollback recommendations: "
                  f"count={len(rollback_recommendations)}"
              )
          print(
              "Rollout rehearsal policy gate passed: "
              f"overall_status={overall_status} "
              f"rollback_recommendations={len(rollback_recommendations)}"
          )
          PY
      - name: Canary readiness certification policy gate
        run: |
          python3 scripts/run_canary_readiness_certification.py \
            --rehearsal-report runtime/rollout_rehearsal_report.json \
            --criteria-config config/integration/canary_promotion_criteria.v1.json \
            --approval-status pending \
            --output runtime/canary_rollout_certification_report.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("runtime/canary_rollout_certification_report.json")
          if not report_path.exists():
              raise SystemExit(
                  "Missing canary readiness certification report artifact"
              )
          report = json.loads(report_path.read_text(encoding="utf-8"))
          overall_status = str(report.get("overall_status", "UNKNOWN"))
          readiness_score = report.get("readiness_score")
          blockers = report.get("blockers", [])
          blocker_count = len(blockers) if isinstance(blockers, list) else 0
          if overall_status != "PASS":
              raise SystemExit(
                  "Canary readiness certification failed: "
                  f"overall_status={overall_status} "
                  f"readiness_score={readiness_score} "
                  f"blockers={blocker_count}"
              )
          print(
              "Canary readiness policy gate passed: "
              f"overall_status={overall_status} "
              f"readiness_score={readiness_score} "
              f"blockers={blocker_count}"
          )
          PY
      - name: Upload rollout rehearsal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-rehearsal-report
          path: |
            runtime/rollout_rehearsal_report.json
            runtime/canary_rollout_certification_report.json
            runtime/rollout_rehearsal/**
          if-no-files-found: warn
          retention-days: 14
      - name: Static typing check
        run: |
          PYTHONPATH=src python3 -m mypy src/poly_robot
      - name: Docker compose config check
        run: |
          docker compose config --quiet
      - name: Docker runtime-gui build check
        run: |
          docker compose build runtime-gui
