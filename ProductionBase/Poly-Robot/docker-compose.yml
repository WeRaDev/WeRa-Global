services:
  runtime-gui:
    container_name: poly-robot-runtime-gui
    build:
      context: .
      dockerfile: Dockerfile
    image: poly-robot:local
    command:
      - python
      - scripts/run_runtime_gui.py
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --state-path
      - /app/runtime/runtime_state.json
      - --journal-path
      - /app/runtime/runtime_journal.jsonl
      - --control-state-path
      - /app/runtime/operator_control_state.json
      - --audit-path
      - /app/runtime/operator_action_audit.jsonl
      - --token-required-read-api
    environment:
      POLY_ROBOT_OPERATOR_TOKEN: ${POLY_ROBOT_OPERATOR_TOKEN:-}
    ports:
      - "8765:8765"
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped

  runtime-supervisor:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: Dockerfile
    image: poly-robot:local
    command:
      - python
      - scripts/run_runtime_supervisor.py
      - --events
      - tests/fixtures/replay_events.jsonl
      - --profile
      - config/parameters/profiles/mvp_test_token.v1.json
      - --calibration-policy
      - config/calibration/llm_reliability.v1.json
      - --scenario-pack
      - config/replay/scenario_pack.v1.json
      - --scenario
      - baseline
      - --cycles
      - "3"
      - --state-path
      - /app/runtime/runtime_state.json
      - --journal-path
      - /app/runtime/runtime_journal.jsonl
      - --control-state-path
      - /app/runtime/operator_control_state.json
      - --control-audit-path
      - /app/runtime/operator_action_audit.jsonl
      - --cycle-output-dir
      - /app/runtime/cycles
    volumes:
      - ./runtime:/app/runtime
    restart: "no"

  dev-shell:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    image: poly-robot:local
    command:
      - /bin/sh
    working_dir: /app
    volumes:
      - ./:/app
    stdin_open: true
    tty: true
    restart: "no"

  test-runner:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    image: poly-robot:local
    command:
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -p
      - test_*.py
    working_dir: /app
    volumes:
      - ./:/app
    restart: "no"

  quality-gate:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    image: poly-robot:local
    command:
      - /bin/sh
      - -c
      - ruff check src/poly_robot tests scripts && PYTHONPATH=src python -m mypy src/poly_robot && bandit -q -r src/poly_robot scripts -s B404,B603,B310,B105
    working_dir: /app
    volumes:
      - ./:/app
    restart: "no"
