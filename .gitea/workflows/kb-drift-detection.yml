name: kb-drift-detection

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  drift-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          github-server-url: http://host.docker.internal:3000
          fetch-depth: 0
      - name: Verify pre-installed Python
        run: python3 --version
      - name: Run KB drift detection
        run: python3 kb-governance/ci/scripts/kb_drift_detection.py --strict-formal-proof --report-json /tmp/kb-drift-detection.json --inventory-output /tmp/kb-inventory-drift.json
