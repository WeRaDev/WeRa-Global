name: cityview-revisor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "ProductionBase/CityView/**"

permissions:
  contents: read

jobs:
  revisor-qa:
    name: Revisor QA Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProductionBase/CityView
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://127.0.0.1:3000

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          npm ci 2>&1 | tee /tmp/revisor_${GITHUB_RUN_ID}_install.txt
          exit ${PIPESTATUS[0]}

      - name: Unit tests (vitest)
        id: tests
        continue-on-error: true
        run: |
          npm run test 2>&1 | tee /tmp/revisor_${GITHUB_RUN_ID}_tests.txt
          exit ${PIPESTATUS[0]}

      - name: Build check (vite)
        id: build
        continue-on-error: true
        run: |
          npm run build 2>&1 | tee /tmp/revisor_${GITHUB_RUN_ID}_build.txt
          exit ${PIPESTATUS[0]}

      - name: Post Revisor review comment
        if: always()
        env:
          WERA_GITEA_TOKEN: ${{ secrets.WERA_GITEA_TOKEN }}
          GITEA_URL: http://127.0.0.1:3000
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVISOR_PREFIX: /tmp/revisor_${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          def read_tail(path, max_chars=2000):
              try:
                  text = Path(path).read_text(encoding="utf-8").strip()
                  return text[-max_chars:] if len(text) > max_chars else text
              except Exception:
                  return "(output not available)"

          def icon(outcome):
              return "PASS" if outcome == "success" else "FAIL"

          checks = [
              ("npm install",         os.environ["INSTALL_RESULT"], f"{os.environ.get(\'REVISOR_PREFIX\', \'/tmp/revisor\')}_install.txt"),
              ("Unit tests (vitest)", os.environ["TESTS_RESULT"],   f"{os.environ.get(\'REVISOR_PREFIX\', \'/tmp/revisor\')}_tests.txt"),
              ("Build check (vite)",  os.environ["BUILD_RESULT"],   f"{os.environ.get(\'REVISOR_PREFIX\', \'/tmp/revisor\')}_build.txt"),
          ]

          all_pass   = all(o == "success" for _, o, _ in checks)
          any_failed = any(o == "failure"  for _, o, _ in checks)
          verdict = "PASS" if all_pass else ("CHANGES REQUIRED" if any_failed else "PASS WITH RISK")

          run_url = os.environ.get("RUN_URL", "")
          lines = [
              "## Revisor QA Audit",
              "",
              f"**QA Verdict: {verdict}**  ·  [workflow run]({run_url})",
              "",
              "| Check | Result |",
              "|---|---|",
          ]
          for name, outcome, _ in checks:
              lines.append(f"| {name} | {icon(outcome)} |")

          failing = [(n, p) for n, o, p in checks if o != "success"]
          if failing:
              lines += ["", "### Failing check output"]
              for name, path in failing:
                  lines += [
                      f"<details><summary>{name}</summary>",
                      "", "```", read_tail(path), "```", "</details>", "",
                  ]

          body = "\n".join(lines)
          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/", 1)
          token = os.environ.get("WERA_GITEA_TOKEN", "")
          gitea_url = os.environ["GITEA_URL"]
          pr_number = os.environ["PR_NUMBER"]

          if not token:
              print("WERA_GITEA_TOKEN not set; skipping comment post")
          else:
              url = f"{gitea_url}/api/v1/repos/{owner}/{repo_name}/issues/{pr_number}/comments"
              req = urllib.request.Request(
                  url, data=json.dumps({"body": body}).encode("utf-8"),
                  headers={"Authorization": f"token {token}", "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f"Revisor comment posted: HTTP {resp.status}")
                      print(f"Verdict: {verdict}")
              except Exception as exc:
                  print(f"Failed to post review comment: {exc}")
          PY
