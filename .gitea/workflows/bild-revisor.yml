name: bild-revisor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "ProductionBase/Bild/**"

permissions:
  contents: read

jobs:
  revisor-qa:
    name: Revisor QA Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProductionBase/Bild
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://127.0.0.1:3000

      - name: Set up Python venv
        run: python3 -m venv .revisor-venv

      - name: Install dev tooling
        run: |
          .revisor-venv/bin/pip install --quiet --upgrade pip
          .revisor-venv/bin/pip install --quiet ruff mypy bandit pytest
          .revisor-venv/bin/pip install --quiet -r requirements.txt

      - name: Lint (ruff check)
        id: lint
        continue-on-error: true
        run: |
          .revisor-venv/bin/ruff check . 2>&1 | tee /tmp/revisor_${GITHUB_RUN_ID}_lint.txt
          exit ${PIPESTATUS[0]}

      - name: Format (ruff format)
        id: format
        continue-on-error: true
        run: |
          .revisor-venv/bin/ruff format --check . 2>&1 | tee /tmp/revisor_${GITHUB_RUN_ID}_format.txt
          exit ${PIPESTATUS[0]}

      - name: Type check (mypy)
        id: typecheck
        continue-on-error: true
        run: |
          .revisor-venv/bin/python -m mypy src session_test.py har_extract.py 2>&1 | tee /tmp/revisor_${GITHUB_RUN_ID}_mypy.txt
          exit ${PIPESTATUS[0]}

      - name: Unit tests (pytest)
        id: tests
        continue-on-error: true
        run: |
          .revisor-venv/bin/pytest -q 2>&1 | tee /tmp/revisor_${GITHUB_RUN_ID}_tests.txt
          exit ${PIPESTATUS[0]}

      - name: Security static analysis (bandit)
        id: bandit
        continue-on-error: true
        run: |
          .revisor-venv/bin/bandit -q -r src -s B404,B603,B310,B105 2>&1 | tee /tmp/revisor_${GITHUB_RUN_ID}_bandit.txt
          exit ${PIPESTATUS[0]}

      - name: Post Revisor review comment
        if: always()
        env:
          WERA_GITEA_TOKEN: ${{ secrets.WERA_GITEA_TOKEN }}
          GITEA_URL: http://127.0.0.1:3000
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
          BANDIT_RESULT: ${{ steps.bandit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVISOR_PREFIX: /tmp/revisor_${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          def read_tail(path, max_chars=2000):
              try:
                  text = Path(path).read_text(encoding="utf-8").strip()
                  return text[-max_chars:] if len(text) > max_chars else text
              except Exception:
                  return "(output not available)"

          def icon(outcome):
              return "PASS" if outcome == "success" else "FAIL"

          checks = [
              ("Lint (ruff check)",         os.environ["LINT_RESULT"],     f"{os.environ.get(\'REVISOR_PREFIX\', \'/tmp/revisor\')}_lint.txt"),
              ("Format (ruff format)",       os.environ["FORMAT_RESULT"],   f"{os.environ.get(\'REVISOR_PREFIX\', \'/tmp/revisor\')}_format.txt"),
              ("Type check (mypy)",          os.environ["TYPECHECK_RESULT"],f"{os.environ.get(\'REVISOR_PREFIX\', \'/tmp/revisor\')}_mypy.txt"),
              ("Unit tests (pytest)",        os.environ["TESTS_RESULT"],    f"{os.environ.get(\'REVISOR_PREFIX\', \'/tmp/revisor\')}_tests.txt"),
              ("Security analysis (bandit)", os.environ["BANDIT_RESULT"],   f"{os.environ.get(\'REVISOR_PREFIX\', \'/tmp/revisor\')}_bandit.txt"),
          ]

          all_pass   = all(o == "success" for _, o, _ in checks)
          any_failed = any(o == "failure"  for _, o, _ in checks)
          verdict = "PASS" if all_pass else ("CHANGES REQUIRED" if any_failed else "PASS WITH RISK")

          run_url = os.environ.get("RUN_URL", "")
          lines = [
              "## Revisor QA Audit",
              "",
              f"**QA Verdict: {verdict}**  ·  [workflow run]({run_url})",
              "",
              "| Check | Result |",
              "|---|---|",
          ]
          for name, outcome, _ in checks:
              lines.append(f"| {name} | {icon(outcome)} |")

          failing = [(n, p) for n, o, p in checks if o != "success"]
          if failing:
              lines += ["", "### Failing check output"]
              for name, path in failing:
                  lines += [
                      f"<details><summary>{name}</summary>",
                      "", "```", read_tail(path), "```", "</details>", "",
                  ]

          body = "\n".join(lines)
          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/", 1)
          token = os.environ.get("WERA_GITEA_TOKEN", "")
          gitea_url = os.environ["GITEA_URL"]
          pr_number = os.environ["PR_NUMBER"]

          if not token:
              print("WERA_GITEA_TOKEN not set; skipping comment post")
          else:
              url = f"{gitea_url}/api/v1/repos/{owner}/{repo_name}/issues/{pr_number}/comments"
              req = urllib.request.Request(
                  url, data=json.dumps({"body": body}).encode("utf-8"),
                  headers={"Authorization": f"token {token}", "Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f"Revisor comment posted: HTTP {resp.status}")
                      print(f"Verdict: {verdict}")
              except Exception as exc:
                  print(f"Failed to post review comment: {exc}")
          PY
