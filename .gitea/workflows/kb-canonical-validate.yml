name: kb-canonical-validate

on:
  pull_request:
    paths:
      - "KnowledgeBase/**/*.md"
      - "kb-governance/**/*.md"
      - "kb-governance/ci/scripts/*.py"
      - ".gitea/workflows/kb-canonical-validate.yml"
  push:
    branches:
      - "main"
      - "feat/**"
    paths:
      - "KnowledgeBase/**/*.md"
      - "kb-governance/**/*.md"
      - "kb-governance/ci/scripts/*.py"
      - ".gitea/workflows/kb-canonical-validate.yml"

jobs:
  canonical-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          github-server-url: http://host.docker.internal:3000
      - name: Verify pre-installed Python
        run: python3 --version
      - name: Run canonical KB validation checks
        run: python3 kb-governance/ci/scripts/kb_canonical_validate.py
      - name: Run quality-gate fixture assurance
        run: python3 kb-governance/ci/scripts/kb_quality_gate_fixtures.py
